[project]
name = "maicora-fiscal-engine"
version = "0.1.0"
description = "CFDI 4.0 stamping and cancellation service for Maicora"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
]

[project.optional-dependencies]
# python-satcfdi does the real fiscal mechanics once a tenant has CSDs and a
# PAC contract. The mock provider needs none of it, so it stays optional and
# a sandbox install is not blocked on it.
sat = ["satcfdi>=4.5"]
dev = ["pytest>=8.3", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
